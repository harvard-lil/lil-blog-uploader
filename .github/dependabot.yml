version: 2

updates:
  # The workflow actions are pinned to commit SHAs, which do not look stale on
  # their own; this raises them. Only .github/workflows/ is scanned.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
