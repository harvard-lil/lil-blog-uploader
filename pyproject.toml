[project]
name = "lil-blog-uploader"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3>=1.43.104",
    "flask>=3.1.3",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.2.0",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F"]
